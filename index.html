<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>One Ahmedabad - AMC Civic Services Portal</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <!-- Babel Compiler -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            amc: {
              navy: '#0f2942',
              orange: '#e65100',
              saffron: '#f57c00',
              gold: '#ffb300',
              blue: '#0288d1',
              light: '#f4f6f9',
            }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-gray-100 font-sans text-gray-800 antialiased">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // Taxonomy Data Structure
    const SERVICE_TAXONOMY = [
      {
        id: "complaints",
        title: "COMPLAINT CATEGORIES",
        icon: "alert-triangle",
        badge: "17 Subcategories",
        sections: [
          {
            name: "Sanitation and Waste Management",
            items: [
              "Missed or Irregular Garbage Collection",
              "Overflowing Public Bins",
              "Sewage Overflow",
              "Odour from Waste Processing Sites"
            ]
          },
          {
            name: "Streetlight Issues, Infrastructure, and Roads",
            items: [
              "Broken or Non-Functioning Streetlights",
              "Public Toilet Facilities",
              "Potholes",
              "Illegal Parking and Road Obstructions",
              "Damaged Park Equipment and Gates",
              "Streetlight Unavailability"
            ]
          },
          {
            name: "Waterlogging and Water Supply Problems",
            items: [
              "Blocked Drains and Gutters",
              "Low Water Pressure",
              "Flooded Roads After Rain",
              "Lack of Clean Water Supply (Chlorine Overdose or Bad Odour)",
              "Water Distribution Issues"
            ]
          },
          {
            name: "Air Pollution",
            items: [
              "Industrial Smoke",
              "Burning of Plastic and Waste",
              "Excessive Dust from Construction Sites"
            ]
          }
        ]
      },
      {
        id: "certificates",
        title: "CERTIFICATE AND APPROVAL SERVICES",
        icon: "file-check",
        badge: "8 Subcategories",
        sections: [
          {
            name: "Official Licensing & Certificates",
            items: [
              "Birth Certificate",
              "Death Certificate",
              "Marriage Certificate",
              "Property Tax Certificate",
              "Building Approval",
              "Trade Licence",
              "Food Licence",
              "Fire NOC (No Objection Certificate)"
            ]
          }
        ]
      },
      {
        id: "utilities",
        title: "UTILITIES AND INFRASTRUCTURAL CONNECTIONS",
        icon: "wrench",
        badge: "2 Subcategories",
        sections: [
          {
            name: "Infrastructure & Permits",
            items: [
              "Demolition Permit",
              "Tree Felling / Pruning Permission"
            ]
          }
        ]
      },
      {
        id: "payments",
        title: "PAYMENT SERVICES",
        icon: "credit-card",
        badge: "2 Subcategories",
        sections: [
          {
            name: "Municipal Taxes",
            items: [
              "Property Tax Payment",
              "Water Tax Payment"
            ]
          }
        ]
      },
      {
        id: "information",
        title: "INFORMATION AND TRANSPARENCY",
        icon: "info",
        badge: "4 Subcategories",
        sections: [
          {
            name: "Public Governance & Records",
            items: [
              "Right to Information (RTI) Application and Status",
              "Budget and Ward-Wise Development Works",
              "Public Notices and Circulars",
              "Ward Office and Officer Contact Directory"
            ]
          }
        ]
      }
    ];

    // Initial Mock Complaints
    const INITIAL_COMPLAINTS = [
      { id: "AMC-2026-8921", citizen: "Rajesh Patel", ward: "Ward 12 - Navrangpura", mainCat: "COMPLAINT CATEGORIES", subCat: "Potholes", status: "Pending", priority: "High", date: "2026-10-28" },
      { id: "AMC-2026-8922", citizen: "Priya Shah", ward: "Ward 05 - Bodakdev", mainCat: "COMPLAINT CATEGORIES", subCat: "Overflowing Public Bins", status: "In Progress", priority: "Medium", date: "2026-10-29" },
      { id: "AMC-2026-8923", citizen: "Amit Desai", ward: "Ward 18 - Maninagar", mainCat: "CERTIFICATE AND APPROVAL SERVICES", subCat: "Birth Certificate", status: "Approved", priority: "Low", date: "2026-10-25" },
      { id: "AMC-2026-8924", citizen: "Suresh Mehta", ward: "Ward 02 - Sabarmati", mainCat: "COMPLAINT CATEGORIES", subCat: "Low Water Pressure", status: "Resolved", priority: "High", date: "2026-10-24" }
    ];

    function App() {
      const [view, setView] = useState('user'); // 'user' or 'admin'
      const [activeTab, setActiveTab] = useState('home');
      const [searchQuery, setSearchQuery] = useState('');
      const [selectedCategory, setSelectedCategory] = useState(null);
      const [complaintsList, setComplaintsList] = useState(INITIAL_COMPLAINTS);
      
      // Form States
      const [complaintForm, setComplaintForm] = useState({
        name: '', phone: '', ward: 'Ward 12 - Navrangpura', category: '', subcategory: '', details: ''
      });
      const [submissionSuccess, setSubmissionSuccess] = useState(null);

      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      }, [view, activeTab, selectedCategory]);

      // Calculate total count
      const totalSubcategories = SERVICE_TAXONOMY.reduce((acc, cat) => {
        const count = cat.sections.reduce((sAcc, sec) => sAcc + sec.items.length, 0);
        return acc + count;
      }, 0);

      const handleComplaintSubmit = (e) => {
        e.preventDefault();
        const newId = `AMC-2026-${Math.floor(1000 + Math.random() * 9000)}`;
        const newEntry = {
          id: newId,
          citizen: complaintForm.name || "Anonymous",
          ward: complaintForm.ward,
          mainCat: complaintForm.category,
          subCat: complaintForm.subcategory,
          status: "Pending",
          priority: "Medium",
          date: new Date().toISOString().split('T')[0]
        };
        setComplaintsList([newEntry, ...complaintsList]);
        setSubmissionSuccess(newId);
        setComplaintForm({ name: '', phone: '', ward: 'Ward 12 - Navrangpura', category: '', subcategory: '', details: '' });
      };

      const handleStatusChange = (id, newStatus) => {
        setComplaintsList(complaintsList.map(c => c.id === id ? { ...c, status: newStatus } : c));
      };

      return (
        <div className="min-h-screen flex flex-col bg-gray-50">
          
          {/* Top Header / Banner */}
          <header className="bg-amc-navy text-white border-b-4 border-amc-saffron shadow-lg">
            <div className="max-w-7xl mx-auto px-4 py-3 flex flex-col md:flex-row items-center justify-between gap-4">
              <div className="flex items-center space-x-4">
                <div className="w-14 h-14 rounded-full bg-white p-1 flex items-center justify-center shadow">
                  <div className="w-full h-full rounded-full bg-amc-orange text-white flex items-center justify-center font-bold text-xl">
                    AMC
                  </div>
                </div>
                <div>
                  <h1 className="text-2xl font-black tracking-wide text-white flex items-center gap-2">
                    ONE AHMEDABAD <span className="text-xs bg-amc-saffron px-2 py-0.5 rounded text-white font-semibold uppercase">Official Portal</span>
                  </h1>
                  <p className="text-xs text-blue-200">Ahmedabad Municipal Corporation • Amdavad Municipal Seva</p>
                </div>
              </div>

              {/* View Switcher Controls */}
              <div className="flex items-center bg-slate-800 p-1 rounded-lg border border-slate-700">
                <button 
                  onClick={() => { setView('user'); setActiveTab('home'); }} 
                  className={`px-4 py-2 rounded-md text-xs font-bold transition-all ${view === 'user' ? 'bg-amc-saffron text-white shadow' : 'text-gray-300 hover:text-white'}`}
                >
                  Citizen Portal (User)
                </button>
                <button 
                  onClick={() => { setView('admin'); setActiveTab('dashboard'); }} 
                  className={`px-4 py-2 rounded-md text-xs font-bold transition-all ${view === 'admin' ? 'bg-red-600 text-white shadow' : 'text-gray-300 hover:text-white'}`}
                >
                  Official Dashboard (Admin)
                </button>
              </div>
            </div>
          </header>

          {/* User Navigation Bar */}
          {view === 'user' && (
            <nav className="bg-white shadow border-b border-gray-200 sticky top-0 z-40">
              <div className="max-w-7xl mx-auto px-4 flex flex-wrap gap-2 text-sm font-semibold">
                <button 
                  onClick={() => setActiveTab('home')}
                  className={`py-3 px-4 border-b-2 ${activeTab === 'home' ? 'border-amc-orange text-amc-orange font-bold' : 'border-transparent text-gray-600 hover:text-amc-navy'}`}
                >
                  Home Services
                </button>
                <button 
                  onClick={() => setActiveTab('register')}
                  className={`py-3 px-4 border-b-2 ${activeTab === 'register' ? 'border-amc-orange text-amc-orange font-bold' : 'border-transparent text-gray-600 hover:text-amc-navy'}`}
                >
                  Register Complaint
                </button>
                <button 
                  onClick={() => setActiveTab('track')}
                  className={`py-3 px-4 border-b-2 ${activeTab === 'track' ? 'border-amc-orange text-amc-orange font-bold' : 'border-transparent text-gray-600 hover:text-amc-navy'}`}
                >
                  Track Status
                </button>
                <button 
                  onClick={() => setActiveTab('summary')}
                  className={`py-3 px-4 border-b-2 ${activeTab === 'summary' ? 'border-amc-orange text-amc-orange font-bold' : 'border-transparent text-gray-600 hover:text-amc-navy'}`}
                >
                  Services Directory & Summary
                </button>
              </div>
            </nav>
          )}

          {/* MAIN CONTENT AREA */}
          <main className="flex-grow max-w-7xl w-full mx-auto px-4 py-6">

            {/* USER SIDE CONTENT */}
            {view === 'user' && (
              <>
                {/* TAB 1: HOME SERVICES */}
                {activeTab === 'home' && (
                  <div className="space-y-8">
                    
                    {/* Hero Search Section */}
                    <div className="bg-gradient-to-r from-amc-navy via-slate-800 to-amc-navy rounded-2xl p-8 text-white shadow-xl">
                      <div className="max-w-3xl mx-auto text-center space-y-4">
                        <span className="inline-block bg-amc-saffron text-white text-xs px-3 py-1 rounded-full font-bold uppercase tracking-wider">Amdavad Citizen Services</span>
                        <h2 className="text-3xl md:text-4xl font-extrabold">How can AMC help you today?</h2>
                        <p className="text-gray-300 text-sm">Access public infrastructure services, certificates, property tax payment, and report municipal issues directly to Ward Officers.</p>
                        
                        {/* Search Bar */}
                        <div className="relative mt-4">
                          <input 
                            type="text" 
                            placeholder="Search service, e.g., 'Birth Certificate', 'Potholes', 'Property Tax'..."
                            value={searchQuery}
                            onChange={(e) => setSearchQuery(e.target.value)}
                            className="w-full pl-5 pr-12 py-3.5 rounded-xl text-gray-800 focus:outline-none focus:ring-4 focus:ring-amc-saffron shadow-lg font-medium"
                          />
                          <button className="absolute right-3 top-2.5 bg-amc-orange text-white p-2 rounded-lg hover:bg-amc-saffron transition">
                            🔍
                          </button>
                        </div>
                      </div>
                    </div>

                    {/* Service Categories Grid */}
                    <div className="space-y-6">
                      <div className="flex justify-between items-center border-b pb-2">
                        <div>
                          <h3 className="text-xl font-bold text-amc-navy">Municipal Public Service Categories</h3>
                          <p className="text-xs text-gray-500">Select a category to view subservices and launch online requests</p>
                        </div>
                        <span className="text-xs font-bold text-amc-orange bg-orange-50 px-3 py-1 rounded-full border border-orange-200">
                          Total 5 Main Categories
                        </span>
                      </div>

                      <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                        {SERVICE_TAXONOMY.filter(cat => 
                          !searchQuery || 
                          cat.title.toLowerCase().includes(searchQuery.toLowerCase()) ||
                          cat.sections.some(s => s.items.some(i => i.toLowerCase().includes(searchQuery.toLowerCase())))
                        ).map((cat, idx) => (
                          <div key={cat.id} className="bg-white rounded-xl border border-gray-200 shadow-sm hover:shadow-md transition flex flex-col overflow-hidden">
                            <div className="p-5 border-b border-gray-100 bg-slate-50 flex items-start justify-between">
                              <div>
                                <span className="text-xs font-extrabold text-amc-saffron">0{idx + 1}. CATEGORY</span>
                                <h4 className="font-bold text-amc-navy text-base mt-1">{cat.title}</h4>
                              </div>
                              <span className="bg-blue-100 text-blue-800 text-xs font-semibold px-2.5 py-1 rounded-full">
                                {cat.badge}
                              </span>
                            </div>

                            <div className="p-5 flex-grow space-y-4 text-sm">
                              {cat.sections.map((section, sIdx) => (
                                <div key={sIdx} className="space-y-2">
                                  <h5 className="font-semibold text-xs text-gray-500 uppercase tracking-wider">{section.name}</h5>
                                  <ul className="space-y-1.5">
                                    {section.items.map((item, iIdx) => (
                                      <li key={iIdx} className="flex items-center justify-between text-gray-700 hover:text-amc-orange cursor-pointer group" onClick={() => { setActiveTab('register'); setComplaintForm({...complaintForm, category: cat.title, subcategory: item}); }}>
                                        <span className="group-hover:translate-x-1 transition-transform">▸ {item}</span>
                                        <span className="text-xs text-amc-saffron opacity-0 group-hover:opacity-100 transition-opacity">Apply →</span>
                                      </li>
                                    ))}
                                  </ul>
                                </div>
                              ))}
                            </div>

                            <div className="p-4 bg-gray-50 border-t border-gray-100 text-right">
                              <button 
                                onClick={() => { setActiveTab('register'); setComplaintForm({...complaintForm, category: cat.title}); }}
                                className="w-full py-2 bg-amc-navy hover:bg-slate-800 text-white rounded-lg text-xs font-bold transition"
                              >
                                Select Service Category
                              </button>
                            </div>
                          </div>
                        ))}
                      </div>
                    </div>
                  </div>
                )}

                {/* TAB 2: REGISTER COMPLAINT / APPLICATION */}
                {activeTab === 'register' && (
                  <div className="max-w-3xl mx-auto bg-white rounded-2xl shadow-lg border border-gray-200 overflow-hidden">
                    <div className="bg-amc-navy p-6 text-white">
                      <h3 className="text-xl font-bold">Submit Application / Grievance Complaint</h3>
                      <p className="text-xs text-blue-200 mt-1">Grievances are immediately logged into AMC PostgreSQL Database & routed to relevant Ward Officer.</p>
                    </div>

                    {submissionSuccess ? (
                      <div className="p-8 text-center space-y-4">
                        <div className="w-16 h-16 bg-green-100 text-green-600 rounded-full flex items-center justify-center mx-auto text-3xl font-bold">✓</div>
                        <h4 className="text-2xl font-bold text-gray-800">Application Submitted Successfully!</h4>
                        <p className="text-sm text-gray-600">Your AMC Application ID is: <strong className="text-amc-orange text-lg">{submissionSuccess}</strong></p>
                        <p className="text-xs text-gray-500">You will receive SMS notifications on status changes. Target SLA resolution: 48 Hours.</p>
                        <div className="pt-4 flex justify-center gap-4">
                          <button onClick={() => setSubmissionSuccess(null)} className="px-5 py-2 bg-amc-navy text-white text-xs font-bold rounded-lg">Submit Another</button>
                          <button onClick={() => setActiveTab('track')} className="px-5 py-2 bg-amc-saffron text-white text-xs font-bold rounded-lg">Track Status</button>
                        </div>
                      </div>
                    ) : (
                      <form onSubmit={handleComplaintSubmit} className="p-6 space-y-4">
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                          <div>
                            <label className="block text-xs font-bold text-gray-700 mb-1">Citizen Full Name</label>
                            <input 
                              type="text" 
                              required 
                              placeholder="e.g. Rameshchandra Patel"
                              value={complaintForm.name}
                              onChange={(e) => setComplaintForm({...complaintForm, name: e.target.value})}
                              className="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-amc-saffron focus:outline-none"
                            />
                          </div>

                          <div>
                            <label className="block text-xs font-bold text-gray-700 mb-1">Contact Phone Number</label>
                            <input 
                              type="tel" 
                              required 
                              placeholder="+91 9876543210"
                              value={complaintForm.phone}
                              onChange={(e) => setComplaintForm({...complaintForm, phone: e.target.value})}
                              className="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-amc-saffron focus:outline-none"
                            />
                          </div>
                        </div>

                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                          <div>
                            <label className="block text-xs font-bold text-gray-700 mb-1">Select Municipal Ward</label>
                            <select 
                              value={complaintForm.ward}
                              onChange={(e) => setComplaintForm({...complaintForm, ward: e.target.value})}
                              className="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-amc-saffron focus:outline-none"
                            >
                              <option>Ward 12 - Navrangpura</option>
                              <option>Ward 05 - Bodakdev</option>
                              <option>Ward 18 - Maninagar</option>
                              <option>Ward 02 - Sabarmati</option>
                              <option>Ward 08 - Satellite & Jodhpur</option>
                            </select>
                          </div>

                          <div>
                            <label className="block text-xs font-bold text-gray-700 mb-1">Main Category</label>
                            <select 
                              required
                              value={complaintForm.category}
                              onChange={(e) => setComplaintForm({...complaintForm, category: e.target.value, subcategory: ''})}
                              className="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-amc-saffron focus:outline-none"
                            >
                              <option value="">-- Choose Category --</option>
                              {SERVICE_TAXONOMY.map(c => <option key={c.id} value={c.title}>{c.title}</option>)}
                            </select>
                          </div>
                        </div>

                        <div>
                          <label className="block text-xs font-bold text-gray-700 mb-1">Subcategory Service</label>
                          <select 
                            required
                            value={complaintForm.subcategory}
                            onChange={(e) => setComplaintForm({...complaintForm, subcategory: e.target.value})}
                            className="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-amc-saffron focus:outline-none"
                          >
                            <option value="">-- Choose Subcategory --</option>
                            {complaintForm.category && SERVICE_TAXONOMY.find(c => c.title === complaintForm.category)?.sections.flatMap(s => s.items).map((item, idx) => (
                              <option key={idx} value={item}>{item}</option>
                            ))}
                          </select>
                        </div>

                        <div>
                          <label className="block text-xs font-bold text-gray-700 mb-1">Detailed Description / Location Particulars</label>
                          <textarea 
                            rows="4" 
                            required
                            placeholder="Specify street address, landmark, and exact nature of grievance or certificate details..."
                            value={complaintForm.details}
                            onChange={(e) => setComplaintForm({...complaintForm, details: e.target.value})}
                            className="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-amc-saffron focus:outline-none"
                          ></textarea>
                        </div>

                        <div className="bg-gray-50 p-4 rounded-lg border border-dashed border-gray-300 text-center">
                          <p className="text-xs text-gray-500">Upload Photo Proof / Attachment (Simulated Firebase Storage)</p>
                          <input type="file" className="mt-2 text-xs text-gray-500" />
                        </div>

                        <button 
                          type="submit" 
                          className="w-full py-3 bg-amc-orange hover:bg-amc-saffron text-white font-bold rounded-xl text-sm shadow-md transition"
                        >
                          Submit Official Application
                        </button>
                      </form>
                    )}
                  </div>
                )}

                {/* TAB 3: TRACK STATUS */}
                {activeTab === 'track' && (
                  <div className="max-w-4xl mx-auto space-y-6">
                    <div className="bg-white p-6 rounded-2xl shadow border border-gray-200">
                      <h3 className="text-lg font-bold text-amc-navy mb-4">Track Service Complaint / Application Status</h3>
                      <div className="overflow-x-auto">
                        <table className="w-full text-left text-xs">
                          <thead className="bg-slate-100 text-gray-600 font-bold uppercase">
                            <tr>
                              <th className="p-3">Reference ID</th>
                              <th className="p-3">Applicant</th>
                              <th className="p-3">Category / Service</th>
                              <th className="p-3">Ward</th>
                              <th className="p-3">Date</th>
                              <th className="p-3">Status</th>
                            </tr>
                          </thead>
                          <tbody className="divide-y">
                            {complaintsList.map(item => (
                              <tr key={item.id} className="hover:bg-slate-50">
                                <td className="p-3 font-bold text-amc-navy">{item.id}</td>
                                <td className="p-3 font-medium">{item.citizen}</td>
                                <td className="p-3">
                                  <div className="font-semibold">{item.subCat}</div>
                                  <div className="text-[10px] text-gray-400">{item.mainCat}</div>
                                </td>
                                <td className="p-3 text-gray-600">{item.ward}</td>
                                <td className="p-3 text-gray-500">{item.date}</td>
                                <td className="p-3">
                                  <span className={`px-2 py-1 rounded-full text-[10px] font-extrabold ${
                                    item.status === 'Resolved' || item.status === 'Approved' ? 'bg-green-100 text-green-700' :
                                    item.status === 'In Progress' ? 'bg-blue-100 text-blue-700' : 'bg-amber-100 text-amber-700'
                                  }`}>
                                    {item.status}
                                  </span>
                                </td>
                              </tr>
                            ))}
                          </tbody>
                        </table>
                      </div>
                    </div>
                  </div>
                )}

                {/* TAB 4: SUMMARY TABLE */}
                {activeTab === 'summary' && (
                  <div className="max-w-4xl mx-auto bg-white rounded-2xl shadow-lg border border-gray-200 p-6 space-y-6">
                    <div>
                      <h3 className="text-xl font-black text-amc-navy">SUMMARY OF SERVICE CATEGORIES</h3>
                      <p className="text-xs text-gray-500 mt-1">Documented breakdown submitted for AMC Public Service Mentor Review.</p>
                    </div>

                    <div className="overflow-hidden rounded-xl border border-gray-200">
                      <table className="w-full text-left border-collapse text-sm">
                        <thead>
                          <tr className="bg-amc-navy text-white font-bold">
                            <th className="p-3 border-b">Main Category</th>
                            <th className="p-3 border-b text-center">Number of Subcategories</th>
                          </tr>
                        </thead>
                        <tbody className="divide-y divide-gray-200 text-gray-800">
                          {SERVICE_TAXONOMY.map(cat => {
                            const subCount = cat.sections.reduce((acc, s) => acc + s.items.length, 0);
                            return (
                              <tr key={cat.id} className="hover:bg-amber-50/40">
                                <td className="p-3.5 font-semibold text-amc-navy flex items-center gap-2">
                                  <span className="w-2 h-2 rounded-full bg-amc-orange"></span>
                                  {cat.title}
                                </td>
                                <td className="p-3.5 text-center font-bold text-amc-saffron">{subCount}</td>
                              </tr>
                            );
                          })}
                        </tbody>
                        <tfoot>
                          <tr className="bg-slate-100 font-black text-amc-navy border-t-2 border-slate-300">
                            <td className="p-4">TOTAL MUNICIPAL SERVICES OFFERED</td>
                            <td className="p-4 text-center text-lg text-amc-orange">{totalSubcategories} Subcategories</td>
                          </tr>
                        </tfoot>
                      </table>
                    </div>
                  </div>
                )}
              </>
            )}

            {/* ADMIN SIDE CONTENT */}
            {view === 'admin' && (
              <div className="space-y-6">
                <div className="bg-red-900 text-white p-6 rounded-2xl shadow-lg flex justify-between items-center">
                  <div>
                    <h2 className="text-2xl font-black">AMC Officer Administration Command</h2>
                    <p className="text-xs text-red-200">Node.js + PostgreSQL Backend Controller Hub • Ward Management System</p>
                  </div>
                  <span className="bg-red-800 text-red-100 px-3 py-1 rounded-full text-xs font-mono font-bold">REST API: ACTIVE</span>
                </div>

                {/* Quick Admin Stats */}
                <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-4">
                  <div className="bg-white p-4 rounded-xl border border-gray-200 shadow-sm">
                    <p className="text-xs font-bold text-gray-400 uppercase">Total Complaints Logged</p>
                    <p className="text-2xl font-black text-amc-navy mt-1">{complaintsList.length}</p>
                  </div>
                  <div className="bg-white p-4 rounded-xl border border-gray-200 shadow-sm">
                    <p className="text-xs font-bold text-amber-500 uppercase">Pending Action</p>
                    <p className="text-2xl font-black text-amber-600 mt-1">{complaintsList.filter(c=>c.status==='Pending').length}</p>
                  </div>
                  <div className="bg-white p-4 rounded-xl border border-gray-200 shadow-sm">
                    <p className="text-xs font-bold text-blue-500 uppercase">In Progress</p>
                    <p className="text-2xl font-black text-blue-600 mt-1">{complaintsList.filter(c=>c.status==='In Progress').length}</p>
                  </div>
                  <div className="bg-white p-4 rounded-xl border border-gray-200 shadow-sm">
                    <p className="text-xs font-bold text-green-500 uppercase">Resolved</p>
                    <p className="text-2xl font-black text-green-600 mt-1">{complaintsList.filter(c=>c.status==='Resolved'||c.status==='Approved').length}</p>
                  </div>
                </div>

                {/* Admin Management Table */}
                <div className="bg-white rounded-2xl shadow border border-gray-200 overflow-hidden">
                  <div className="p-4 bg-slate-50 border-b flex justify-between items-center">
                    <h3 className="font-bold text-amc-navy text-sm">Grievance & Service Application Pipeline</h3>
                    <span className="text-xs text-gray-500">Live PostgreSQL Table Sync</span>
                  </div>

                  <div className="overflow-x-auto">
                    <table className="w-full text-left text-xs">
                      <thead className="bg-slate-100 text-gray-600 font-bold uppercase">
                        <tr>
                          <th className="p-3">Ref ID</th>
                          <th className="p-3">Citizen Name</th>
                          <th className="p-3">Ward Jurisdiction</th>
                          <th className="p-3">Category / Subcategory</th>
                          <th className="p-3">Date Received</th>
                          <th className="p-3">Current Status</th>
                          <th className="p-3 text-right">Action Status Change</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y">
                        {complaintsList.map((item) => (
                          <tr key={item.id} className="hover:bg-slate-50">
                            <td className="p-3 font-mono font-bold text-amc-navy">{item.id}</td>
                            <td className="p-3 font-medium">{item.citizen}</td>
                            <td className="p-3 text-gray-600">{item.ward}</td>
                            <td className="p-3">
                              <div className="font-bold text-gray-800">{item.subCat}</div>
                              <div className="text-[10px] text-gray-400">{item.mainCat}</div>
                            </td>
                            <td className="p-3 text-gray-500">{item.date}</td>
                            <td className="p-3">
                              <span className={`px-2.5 py-1 rounded-full text-[10px] font-extrabold ${
                                item.status === 'Resolved' || item.status === 'Approved' ? 'bg-green-100 text-green-700' :
                                item.status === 'In Progress' ? 'bg-blue-100 text-blue-700' : 'bg-amber-100 text-amber-700'
                              }`}>
                                {item.status}
                              </span>
                            </td>
                            <td className="p-3 text-right space-x-1">
                              <button 
                                onClick={() => handleStatusChange(item.id, 'In Progress')}
                                className="px-2 py-1 bg-blue-600 text-white rounded text-[10px] font-bold hover:bg-blue-700"
                              >
                                Mark In Progress
                              </button>
                              <button 
                                onClick={() => handleStatusChange(item.id, 'Resolved')}
                                className="px-2 py-1 bg-green-600 text-white rounded text-[10px] font-bold hover:bg-green-700"
                              >
                                Resolve
                              </button>
                            </td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>
              </div>
            )}

          </main>

          {/* Footer */}
          <footer className="bg-amc-navy text-gray-400 text-xs border-t border-slate-700 mt-12">
            <div className="max-w-7xl mx-auto px-4 py-6 flex flex-col md:flex-row justify-between items-center gap-4">
              <div className="text-center md:text-left">
                <p className="text-white font-bold">Ahmedabad Municipal Corporation (AMC)</p>
                <p className="mt-0.5">One Ahmedabad Digital Seva • Dedicated Public Governance Portal</p>
              </div>
              <p>© 2026 AMC. All Rights Reserved. Prepared for Mentor Project Submission.</p>
            </div>
          </footer>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
